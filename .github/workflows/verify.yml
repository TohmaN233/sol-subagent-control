name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workflow-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned development dependencies
        working-directory: plugins/sol-advisor/control-plane
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type-check and compare committed web assets and licenses
        working-directory: plugins/sol-advisor/control-plane
        run: npm run check:web
  isolation-probe-invariants:
    name: isolation-probe-invariants-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify discovery and synthetic probe invariants without credentials
        run: node --test spikes/skill-isolation/assertions.test.mjs spikes/skill-isolation/fixture-policy.test.mjs

  connector-matrix:
    name: connector-protocol-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check connector runtime and fixtures
        run: >-
          node --check plugins/sol-advisor/control-plane/server.mjs &&
          node --check plugins/sol-advisor/control-plane/connectors/cursor-cdp.mjs &&
          node --check plugins/sol-advisor/control-plane/connectors/grok-acp.mjs &&
          node --check plugins/sol-advisor/control-plane/test/fixtures/fake-cursor.mjs &&
          node --check plugins/sol-advisor/control-plane/test/fixtures/fake-grok.mjs
      - name: Run process and protocol connector tests
        run: node plugins/sol-advisor/control-plane/test/run-tests.mjs
      - name: Verify cross-platform native role tools
        run: node --test plugins/sol-advisor/scripts/test/native-role-tools.test.mjs

  full-verify:
    name: full-repository-verify
    needs: connector-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify native Sol Advisor core
        run: sh plugins/sol-advisor/scripts/verify.sh
      - name: Verify configurable control plane
        run: sh plugins/sol-advisor/scripts/verify-control-plane.sh

name: export-source

on:
  push:
    branches:
      - fix/builtin-grok-acp-connector
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: source-tree
          path: .
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

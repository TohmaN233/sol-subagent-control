name: export-implementation-source

on:
  push:
    branches:
      - feat/builtin-cursor-grok-write
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: implementation-source
          path: .
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

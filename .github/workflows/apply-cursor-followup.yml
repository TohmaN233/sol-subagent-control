name: apply-cursor-followup

on:
  push:
    branches:
      - fix/cursor-31629-panel-profile
    paths:
      - .github/cursor-followup-upload/READY

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cursor-31629-panel-profile
          fetch-depth: 0
      - name: Reconstruct reviewed follow-up
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "bc7e971773b0cd1d8bee9c7b6078d58a8a704b84"
          test "$(git merge-base HEAD bc7e971773b0cd1d8bee9c7b6078d58a8a704b84)" = "bc7e971773b0cd1d8bee9c7b6078d58a8a704b84"
          test -f .github/cursor-followup-upload/READY
          test "$(find .github/cursor-followup-upload -maxdepth 1 -type f -name 'part-*' | wc -l | tr -d ' ')" = 3
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path('.github/cursor-followup-upload')

          def blob_sha(text):
              data = text.encode('ascii')
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()

          expected = {
              'part-00': 'f0cafce82562eb8bf5895ff11505585b05f88f42',
              'part-01': 'bc2891d6f0b4dc37c4995512254d9a98c35da250',
              'part-02': '0aeef3ee2b1934c975a28be7897d310ae8361f67',
          }

          part0_path = root / 'part-00'
          part0 = part0_path.read_text(encoding='ascii')
          if blob_sha(part0) != expected['part-00']:
              repairs = [part0[:index] + part0[index + 1:] for index in range(len(part0))
                         if blob_sha(part0[:index] + part0[index + 1:]) == expected['part-00']]
              if len(repairs) != 1:
                  raise SystemExit(f'part-00 repair was not unique: {len(repairs)}')
              part0 = repairs[0]
              part0_path.write_text(part0, encoding='ascii')

          part2_path = root / 'part-02'
          part2 = part2_path.read_text(encoding='ascii')
          if blob_sha(part2) != expected['part-02']:
              if len(part2) != 10936:
                  raise SystemExit(f'unexpected part-02 length: {len(part2)}')
              if hashlib.sha256(part2.encode('ascii')).hexdigest() != '3f45ee015e9a5f42a58a3d7b207afb10cee2afa80236e9f396a3069c6408d4a1':
                  raise SystemExit('part-02 prefix hash mismatch')
              suffix = ''
              part2 = part2 + suffix
              part2_path.write_text(part2, encoding='ascii')

          for name, sha in expected.items():
              actual = blob_sha((root / name).read_text(encoding='ascii'))
              if actual != sha:
                  raise SystemExit(f'{name} blob mismatch: {actual}')
          PY
          cat .github/cursor-followup-upload/part-* | base64 --decode | gzip --decompress --stdout > /tmp/cursor-followup.patch
          printf '%s  %s\n' 'f302e25c523448c5853008588ad316fda3a360130a132912dbcb70f2a4534cde' /tmp/cursor-followup.patch | sha256sum --check --strict
          git apply --check --whitespace=error-all /tmp/cursor-followup.patch
          git apply --index --whitespace=error-all /tmp/cursor-followup.patch
          git rm -rf .github/cursor-followup-upload
          git rm .github/workflows/apply-cursor-followup.yml
          git rm .github/workflows/export-cursor-followup-source.yml
          git diff --cached --check
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Cursor protocol and repository gates
        shell: bash
        run: |
          set -euo pipefail
          for file in plugins/sol-advisor/control-plane/connectors/*.mjs plugins/sol-advisor/control-plane/test/fixtures/*.mjs; do
            node --check "$file"
          done
          node plugins/sol-advisor/control-plane/test/run-tests.mjs
          sh plugins/sol-advisor/scripts/verify-control-plane.sh
          sh plugins/sol-advisor/scripts/verify.sh
          git diff --cached --check
      - name: Commit repository-owned Cursor follow-up
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TohmaN233'
          git config user.email '271796371+TohmaN233@users.noreply.github.com'
          git commit -m 'fix: harden Cursor 3.16.29 panel identity and startup'
          git push origin HEAD:fix/cursor-31629-panel-profile

name: apply-builtin-connectors

on:
  push:
    branches:
      - feat/builtin-cursor-grok-write
    paths:
      - .github/connector-upload/READY
  pull_request:
    branches:
      - main
    paths:
      - .github/connector-upload/**

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/builtin-cursor-grok-write')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/builtin-cursor-grok-write
          fetch-depth: 0
      - name: Reconstruct and verify implementation patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "b3c655ec8a790b4441c60fe6c06c1f98dc7671dd"
          test "$(git merge-base HEAD b3c655ec8a790b4441c60fe6c06c1f98dc7671dd)" = "b3c655ec8a790b4441c60fe6c06c1f98dc7671dd"
          test -f .github/connector-upload/READY
          test "$(find .github/connector-upload -maxdepth 1 -type f -name 'part-*' | wc -l | tr -d ' ')" = 6
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path('.github/connector-upload')
          alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='

          def git_blob_sha(text):
              data = text.encode('ascii')
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()

          p00 = (root / 'part-00').read_text(encoding='ascii')
          expected00 = '274c81fb6b5bef140a0ace7eca12d3ee0ec7fa77'
          if git_blob_sha(p00) != expected00:
              positions = []
              for index in range(len(p00)):
                  candidate = p00[:index] + p00[index + 1:]
                  if git_blob_sha(candidate) == expected00:
                      positions.append(index)
              if len(positions) != 1:
                  raise SystemExit(f'part-00 repair was not unique: {positions}')
              index = positions[0]
              p00 = p00[:index] + p00[index + 1:]
              (root / 'part-00').write_text(p00, encoding='ascii')
          if git_blob_sha(p00) != expected00:
              raise SystemExit('part-00 blob mismatch after repair')

          expected_blocks = [
              'c32cf1e458c32d9e8e577813f3efbf7e88e7b5561f4753a95cd0de06bd51739a','97c668a9d4f0ccb4d74fcf4b08cdb39e693c6cccfabb7f12256acc38a22ef37f','fa70ce5d3cb555665226aacd9d1ab6e55b60f430a38a896e82bcdeb78791be8a','5f71f24a49cd201c3ebe6d8b0dbbebe538ba789b01adb9b3ef3c77e760107a4a','9d0d849343e7c1b185b51056a048da98dcb34e24dafdc23a79046de0de0c2eb7','bff1ee1a15620672520db0a458117f264346e1f003e02adef28fee3b90e56349','12d7126825360eedf707aea2342bfcea4c01d243677898655933e87dfad59276','635d546fd690fdf582d09fe7aa2d97b6e9510c665e7c8329799cb4d53baafd51','9867814eae9531508c1ebddee226a4f1f0c32632d2676563b60edc25f328a8c7','dec6e5d08368f02b5ae27a660a2f5d4602f61fd1529fb0ff8552daefe4a207de','c9fc120ec4466b81f622422a032b8150989e9106c57e1c5733837325b126d1e0','7d1609ac1966b275482891d1da802e6a241c2fcb154021df7d243427240874a6','39086e00cab909633a25b8629203b3093b4e9446c142033ecdedaa7d1c6b134b','6784f1fe3ecb96661ed539c11271a75d3d70c86a5ad5e1ab20caed2164aeb7a8','6e82566a5107c666b7866c41727f7f93c499ff9c7757a8575fdc17f7ce5d117b','6bc6e74c4b2b8206aef7b25947a1ca9b6b49c3b92cb966d4d8c85102d1257861','0fb99247c785abb1cc85472c1e56fefdb9bc4cd9cea3fa9c3dc6a85d2d6dd9e9','38885c6839a00470cfff2f94d7958e1e3e01a932367777d2ba32948d819046e2','08b1a0ce77183726201ea1dee9aebbbb51ee087dd5f8b6a07dafcf24dd890276','cf0638e8d6dfaf0d54da8e21979a754388e0f9de3bafb575c7f9ebe535f06b39','69a42fe00348c7f1ba029577eea9ad970c0c5b435065d1c14a9461f7a7515042','cc42bb17405ef9e7d759bdd1e9ed7aa6788f0455ec83d69e09e3bd851c20c01b','f1802d3e49f562439f4ca0e74a675c6921196ea91042a609b8644d508340182c','9037be3bd92309b4976c1a0d3c2ddabc535543ac8af959964f4107122c2fd793','a4fc1773875f27661bae02f20b4d1065201c37f283a38da0d01d6fbebdf76a4a','165b1bfbdf73e7a3f95ede2013de99c42372bf1052f5c736e9dbe262835ebe85','02772480ea5e297bd3fce93a22d6bb7b7a22b7127926925b63c6dde5dfcb9160','8d7210467cc20a3e3b6ebf3a26cc4ddf450244bce2ca9d1d7132d8cc33950c92','e7bc39a90d5496ea7123d020e2a7ae09e01946b0aa111edd68bc567f8e966237','7a64568621eb8ff1aa82cda503795c526dd8e364069009fa40b24972895d167a','7a398d5deb0508848363ed998bb7790bbbcca9f2ba556c8101f4218e3a3e8302','1e3b079614a83b258894bf2315a1fc480d216dc265dd1d6d71689fbc1241547b','9bb3bd1d1d85e5c297380177f9a4af7ab8eacff55dea61d4a4ad7a7eb305fa58','f9e70f8c8ed68c6aed3ae778c3197b815b59463d2ee64d0960b340f1acb5aa02','bd95e8f11512636b88a6b169adeafb8146e58af283437089aa198a7dbb95720a','8e4547e21b7507e2a0eb113d33136f321a2313172a3c382737314d6bb35d3abf','832cd93b5dd30d356cdcedbb6fe0849cab4a06f196afc94431cc8bf59c0eb2ff','eda229d28de51daee157cdfaa5b30f026feec824823b107ed91edeb80da19935','d2b61e9a65aeee1fa501fa3d9d3f0c7fc199719d561ed8dc59a48cc966f312c5','7bb620000d9aea014ea985f60da59f6f09f4163aa684d8971460c12c1972edb0','59d60dae57d9baa4f5660f56f270be887595539c36ea6aba55c57f0a49885df0','f88075bebaf7d2795007333894d78acd9f6f955872bec1fc4a27bf75a21d5a79','4a59e7da9f2d900ae651f8d24e9f6207847cb89a78e5caf2af2d572c13afba50','6f464a3806f213e3b918cf649734bd6981eacb9f04b550bd97362ec4f72527e1','ddfa289e2022d6365afa8c25279d083365ca9826f2aeefe6847d7b0872b46a10','509f7cf81c50c86c2404bec79db3b631d3c349b158318edb1f36222be282fef3','db6869deca4abccf642d9645f2a5b938a4a9dc539d6ebd9310258726e12551f0','10beabb7e5ea79289fa8c9a33073cbdb7ddc6d733add47ae01232c89e3ce435d','bd72a01efca19c08ae8a69a164ab3fb846fa7f669494612d9ad165d0114e629c','58057e743fbfbf9212605dfb0d3d267ef4057899dd52a3b68f56a340ba5bda65','869f0cdb5b4718ddc72131d4624da1a7132094127025a0db82c4c31308704a4d','d3e975686735c2cca8837b5b8dbbbe81376f675760156c4f133d23b4d688d69c','375df3047011d179d6f5a6e35f8bca53c4611647bfefd05603ad0d80567b7bc2','5671ca8afaab2711156bf428578a1742bf39064beac51cb6a40ab7f5de055852','7434c53c18c88ed0f7847df2d96de59f56f6e78691b5d4cb3991cd8e6cfbdf5e','3387f305c7b58184e351c14b7189153ecfeb0e5ee8cf3cfee6bc2b51a2bbac2c','37615b1e71e56130466048c3c0ad5e88dc7ebc99ca362b9546ef8ce23661488a','8006bce4dece629ea3161e5b20cbf1c1287fd6811450ba14bd64964528c5c84f','c048bcbd6349cc430d0bc9f9f5874c716cbf9e9f8bdb0c985dda27a587610267','a4189a9cab87daefb37d9937f7c29e090c2cc8ec81fb4169b3abdc9542faad4c','74060789d2fb19dfa9e36cc6022b3013aa3ebba670584f94b5f804f81e04a1d8','6583f25a60bf83530b8ca4e376c6d7388390fb0e76775766b13403c05b7bc237','b23f6bfe2cef6c6bd97a550a3029c16801b06b6742c35d6477897dfc5f522bd6'
          ]
          p03 = (root / 'part-03').read_text(encoding='ascii')
          expected03 = 'f5b91ed64036eb4e9fd3ead0b5d162c48f96ee22'
          if git_blob_sha(p03) != expected03:
              if len(p03) != 15999:
                  raise SystemExit(f'unexpected part-03 length: {len(p03)}')
              first = None
              for block_index, expected_hash in enumerate(expected_blocks):
                  start = block_index * 256
                  expected_len = min(256, 16000 - start)
                  actual_hash = hashlib.sha256(p03[start:start + expected_len].encode('ascii')).hexdigest()
                  if actual_hash != expected_hash:
                      first = block_index
                      break
              if first is None:
                  raise SystemExit('part-03 mismatch block was not found')
              start = first * 256
              expected_len = min(256, 16000 - start)
              segment = p03[start:start + expected_len - 1]
              repairs = []
              for position in range(expected_len):
                  for char in alphabet:
                      block = segment[:position] + char + segment[position:]
                      if hashlib.sha256(block.encode('ascii')).hexdigest() != expected_blocks[first]:
                          continue
                      candidate = p03[:start + position] + char + p03[start + position:]
                      if git_blob_sha(candidate) == expected03:
                          repairs.append(candidate)
              if len(repairs) != 1:
                  raise SystemExit(f'part-03 repair was not unique: {len(repairs)}')
              p03 = repairs[0]
              (root / 'part-03').write_text(p03, encoding='ascii')
          if git_blob_sha(p03) != expected03:
              raise SystemExit('part-03 blob mismatch after repair')
          PY
          cat .github/connector-upload/part-* | base64 --decode | gzip --decompress --stdout > /tmp/builtin-connectors.patch
          printf '%s  %s\n' '3f1a527d2e2e010c7499a7e71a99a9972c142a9685d514bfb27d1616e25832a2' /tmp/builtin-connectors.patch | sha256sum --check --strict
          git apply --check --whitespace=error-all /tmp/builtin-connectors.patch
          git apply --index --whitespace=error-all /tmp/builtin-connectors.patch
          git rm -r .github/connector-upload
          git rm .github/workflows/apply-builtin-connectors.yml
          git diff --cached --check
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run protocol, connector, and repository gates
        shell: bash
        run: |
          set -euo pipefail
          for file in plugins/sol-advisor/control-plane/connectors/*.mjs plugins/sol-advisor/control-plane/test/fixtures/*.mjs; do
            node --check "$file"
          done
          node plugins/sol-advisor/control-plane/test/run-tests.mjs
          sh plugins/sol-advisor/scripts/verify-control-plane.sh
          sh plugins/sol-advisor/scripts/verify.sh
          git diff --cached --check
      - name: Commit repository-owned connector source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TohmaN233'
          git config user.email '271796371+TohmaN233@users.noreply.github.com'
          git commit -m 'feat: add built-in Cursor and writable Grok connectors'
          git push origin HEAD:feat/builtin-cursor-grok-write
